<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniVente — Tinos TechLogistics</title>
<meta name="description" content="OmniVente : vendez sur WhatsApp, Instagram, Messenger et e-mail depuis un seul tableau de bord.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='19' fill='none' stroke='%234F46E5' stroke-width='6'/%3E%3Cpath d='M15 17 L24 34 L33 17' fill='none' stroke='%2310B981' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ============================================================
   OMNIVENTE — DESIGN SYSTEM
   Palette : Indigo #4F46E5 · Émeraude #10B981 · Violet #8B5CF6
   Display : Bricolage Grotesque · Interface : Plus Jakarta Sans
   ============================================================ */
:root{
  --indigo:#4F46E5; --indigo-soft:#6366F1; --emerald:#10B981; --violet:#8B5CF6;
  --wa:#1FAF56; --ig:#D6316F; --ms:#0B74E8; --em:#D97706;

  --bg:#F5F5FC; --surface:#FFFFFF; --surface-2:#FAFAFF; --surface-3:#F1F1FB;
  --ink:#16172E; --ink-2:#4A4B68; --ink-3:#7A7B96;
  --line:#E6E5F5; --line-2:#D9D8EE;
  --shadow:0 1px 2px rgba(22,23,46,.05), 0 12px 28px -18px rgba(22,23,46,.35);
  --shadow-lift:0 2px 6px rgba(22,23,46,.06), 0 22px 44px -22px rgba(79,70,229,.45);
  --mesh-a:rgba(79,70,229,.32); --mesh-b:rgba(139,92,246,.28); --mesh-c:rgba(16,185,129,.26);
  --mesh-opacity:.85;
  --chip:#EFEEFB; --ok-bg:#E4F7EE; --ok-ink:#07784F; --warn-bg:#FDF0DC; --warn-ink:#9A5B06;
  --bad-bg:#FDE8E8; --bad-ink:#B3261E; --info-bg:#E8EBFD; --info-ink:#3730A3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0D1F; --surface:#15162E; --surface-2:#1A1B38; --surface-3:#202243;
    --ink:#F0F0FA; --ink-2:#B4B5D2; --ink-3:#8384A8;
    --line:#282A4E; --line-2:#343666;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 32px -20px rgba(0,0,0,.9);
    --shadow-lift:0 2px 8px rgba(0,0,0,.45), 0 26px 50px -24px rgba(99,102,241,.6);
    --mesh-a:rgba(99,102,241,.42); --mesh-b:rgba(139,92,246,.36); --mesh-c:rgba(16,185,129,.24);
    --mesh-opacity:.7;
    --chip:#232548; --ok-bg:#0C3A2B; --ok-ink:#5BE3AF; --warn-bg:#40300F; --warn-ink:#F5C065;
    --bad-bg:#43191B; --bad-ink:#F69A97; --info-bg:#1E2150; --info-ink:#A9AEFF;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0D1F; --surface:#15162E; --surface-2:#1A1B38; --surface-3:#202243;
  --ink:#F0F0FA; --ink-2:#B4B5D2; --ink-3:#8384A8;
  --line:#282A4E; --line-2:#343666;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 32px -20px rgba(0,0,0,.9);
  --shadow-lift:0 2px 8px rgba(0,0,0,.45), 0 26px 50px -24px rgba(99,102,241,.6);
  --mesh-a:rgba(99,102,241,.42); --mesh-b:rgba(139,92,246,.36); --mesh-c:rgba(16,185,129,.24);
  --mesh-opacity:.7;
  --chip:#232548; --ok-bg:#0C3A2B; --ok-ink:#5BE3AF; --warn-bg:#40300F; --warn-ink:#F5C065;
  --bad-bg:#43191B; --bad-ink:#F69A97; --info-bg:#1E2150; --info-ink:#A9AEFF;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); min-height:100vh;
  font-family:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  transition:background-color .45s ease, color .45s ease;
}
h1,h2,h3,h4{font-family:"Bricolage Grotesque","Plus Jakarta Sans",serif; font-weight:600; letter-spacing:-.02em; margin:0; line-height:1.15}
h1{font-size:1.75rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--indigo); outline-offset:2px; border-radius:6px}
.num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}

/* ---------- Fond dégradé animé (gradient mesh) ---------- */
.mesh{position:fixed; inset:-20%; z-index:0; pointer-events:none; filter:blur(70px); opacity:var(--mesh-opacity)}
.mesh span{position:absolute; display:block; border-radius:50%;
  transform:translate3d(calc(var(--mx,0)*1px), calc(var(--my,0)*1px), 0);
  transition:transform 1.6s cubic-bezier(.22,1,.36,1)}
.mesh .m1{width:46vw; height:46vw; left:-6vw; top:-4vw; background:radial-gradient(circle at 40% 40%, var(--mesh-a), transparent 66%); animation:drift1 26s ease-in-out infinite}
.mesh .m2{width:52vw; height:52vw; right:-10vw; top:6vw; background:radial-gradient(circle at 55% 45%, var(--mesh-b), transparent 66%); animation:drift2 32s ease-in-out infinite}
.mesh .m3{width:40vw; height:40vw; left:26vw; bottom:-14vw; background:radial-gradient(circle at 50% 50%, var(--mesh-c), transparent 66%); animation:drift3 38s ease-in-out infinite}
@keyframes drift1{50%{transform:translate3d(calc(var(--mx,0)*1px + 6vw), calc(var(--my,0)*1px + 4vw),0) scale(1.12)}}
@keyframes drift2{50%{transform:translate3d(calc(var(--mx,0)*1px - 7vw), calc(var(--my,0)*1px + 6vw),0) scale(.9)}}
@keyframes drift3{50%{transform:translate3d(calc(var(--mx,0)*1px + 4vw), calc(var(--my,0)*1px - 5vw),0) scale(1.08)}}

/* ---------- Structure ---------- */
.app{position:relative; z-index:1; display:grid; grid-template-columns:262px 1fr; min-height:100vh}
.auth-root{min-height:100vh;position:relative;z-index:5;display:grid;place-items:center;padding:24px}
.auth-shell{width:min(960px,100%);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(320px,.95fr);overflow:hidden;border:1px solid var(--line);border-radius:24px;background:var(--surface);box-shadow:var(--shadow-lift)}
.auth-brand{padding:48px;background:linear-gradient(145deg,var(--indigo),var(--violet));color:#fff;display:flex;flex-direction:column;justify-content:space-between;min-height:520px}
.auth-brand .brand{padding:0;color:#fff}.auth-brand .brand small{color:rgba(255,255,255,.76)}
.auth-brand h1{font-size:clamp(2rem,4vw,3.2rem);max-width:430px;margin-top:42px}.auth-brand p{max-width:390px;color:rgba(255,255,255,.82);margin-top:16px}
.auth-form{padding:40px;display:flex;flex-direction:column;justify-content:center}.auth-form h2{font-size:1.7rem}.auth-form>p{color:var(--ink-2);margin:8px 0 26px}
.auth-fields{display:grid;gap:14px}.auth-fields label{display:grid;gap:6px;font-size:.78rem;font-weight:700;color:var(--ink-2)}
.auth-fields input{width:100%;padding:12px 13px;border:1px solid var(--line-2);border-radius:11px;background:var(--surface-2)}
.auth-actions{display:grid;gap:10px;margin-top:20px}.auth-switch{margin-top:20px;text-align:center;color:var(--ink-2);font-size:.82rem}.auth-switch button{border:0;background:none;color:var(--indigo);font-weight:700;cursor:pointer}
.auth-error{min-height:20px;color:var(--bad-ink);font-size:.8rem;margin-top:12px}.auth-note{font-size:.72rem;color:var(--ink-3);margin-top:20px}
.sidebar{position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:6px;
  padding:20px 14px 14px; background:color-mix(in srgb, var(--surface) 82%, transparent);
  backdrop-filter:blur(18px); border-right:1px solid var(--line)}
.brand{display:flex; align-items:center; gap:11px; padding:4px 8px 18px}
.brand svg{width:34px; height:34px; flex:none}
.brand b{font-family:"Bricolage Grotesque",sans-serif; font-size:1.22rem; letter-spacing:-.03em; display:block}
.brand small{display:block; font-size:.7rem; color:var(--ink-3); margin-top:-2px}
.navgroup{font-size:.72rem; color:var(--ink-3); padding:14px 12px 6px; font-weight:600}
.nav{display:flex; align-items:center; gap:11px; width:100%; padding:9px 12px; border:0; border-radius:11px;
  background:transparent; color:var(--ink-2); font-weight:500; font-size:.92rem; cursor:pointer; text-align:left;
  transition:background .18s, color .18s}
.nav svg{width:18px; height:18px; flex:none; opacity:.85}
.nav:hover{background:var(--surface-3); color:var(--ink)}
.nav[aria-current="page"]{background:linear-gradient(97deg, var(--indigo), var(--violet)); color:#fff; box-shadow:0 8px 20px -10px var(--indigo)}
.nav[aria-current="page"] svg{opacity:1}
.nav .count{margin-left:auto; font-size:.72rem; background:var(--chip); color:var(--ink-2); padding:1px 7px; border-radius:20px; font-variant-numeric:tabular-nums}
.nav[aria-current="page"] .count{background:rgba(255,255,255,.22); color:#fff}

.userbtn{margin-top:auto; display:flex; align-items:center; gap:10px; width:100%; padding:10px; border-radius:13px;
  border:1px solid var(--line); background:var(--surface-2); cursor:pointer; text-align:left; transition:border-color .18s, box-shadow .18s}
.userbtn:hover{border-color:var(--line-2); box-shadow:var(--shadow)}
.userbtn .av{width:34px; height:34px; border-radius:10px; flex:none; display:grid; place-items:center; color:#fff;
  background:linear-gradient(140deg,var(--indigo),var(--violet)); font-weight:700; font-size:.82rem}
.userbtn .who{min-width:0}
.userbtn .who b{display:block; font-size:.84rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.userbtn .who span{display:block; font-size:.72rem; color:var(--ink-3)}
.userbtn .caret{margin-left:auto; color:var(--ink-3); transition:transform .2s; display:block}
.userbtn .caret svg{width:14px; height:14px; display:block}
.order .meta svg{width:13px; height:13px; flex:none}
.kpi .lab svg{width:14px; height:14px; color:var(--ink-3)}
.kpi .delta svg{width:13px; height:13px}
.sechead .btn{flex:none}
.tag svg{width:12px; height:12px}
.userbtn[aria-expanded="true"] .caret{transform:rotate(180deg)}

.popover{position:absolute; left:14px; right:14px; bottom:76px; background:var(--surface); border:1px solid var(--line);
  border-radius:14px; box-shadow:var(--shadow-lift); padding:6px; z-index:40;
  animation:pop .16s cubic-bezier(.22,1,.36,1)}
@keyframes pop{from{opacity:0; transform:translateY(6px) scale(.98)}}
.popover .head{padding:9px 11px 10px; border-bottom:1px solid var(--line); margin-bottom:5px}
.popover .head b{display:block; font-size:.86rem}
.popover .head span{font-size:.74rem; color:var(--ink-3)}
.popitem{display:flex; align-items:center; gap:10px; width:100%; padding:9px 11px; border:0; background:transparent;
  border-radius:9px; cursor:pointer; font-size:.88rem; color:var(--ink-2); text-align:left}
.popitem svg{width:16px; height:16px}
.popitem:hover{background:var(--surface-3); color:var(--ink)}
.popitem.danger{color:#D8453C} .popitem.danger:hover{background:var(--bad-bg)}

.main{min-width:0; display:flex; flex-direction:column}
.topbar{position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:14px; padding:13px 26px;
  background:color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter:blur(16px); border-bottom:1px solid var(--line)}
.topbar .crumb{font-size:.78rem; color:var(--ink-3)}
.topbar .crumb b{display:block; font-family:"Bricolage Grotesque",sans-serif; font-size:1.12rem; color:var(--ink); font-weight:600; letter-spacing:-.02em}
.search{margin-left:auto; display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line);
  border-radius:11px; padding:8px 12px; width:280px; max-width:34vw}
.search svg{width:15px; height:15px; color:var(--ink-3); flex:none}
.search input{border:0; background:transparent; outline:none; width:100%; font-size:.88rem}
.iconbtn{display:grid; place-items:center; width:38px; height:38px; border-radius:11px; border:1px solid var(--line);
  background:var(--surface); cursor:pointer; color:var(--ink-2); position:relative; transition:transform .15s, border-color .18s}
.iconbtn:hover{transform:translateY(-1px); border-color:var(--line-2); color:var(--ink)}
.iconbtn svg{width:17px; height:17px}
.iconbtn .dot{position:absolute; top:8px; right:9px; width:7px; height:7px; border-radius:50%; background:var(--emerald); border:2px solid var(--surface)}
.burger{display:none}
main{padding:24px 26px 56px; max-width:1560px; width:100%}

/* ---------- Primitives ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow)}
.pad{padding:18px}
.sechead{display:flex; align-items:flex-end; gap:12px; margin:0 0 14px}
.sechead p{font-size:.84rem; color:var(--ink-3)}
.btn{display:inline-flex; align-items:center; gap:8px; padding:9px 15px; border-radius:11px; border:1px solid transparent;
  background:linear-gradient(97deg,var(--indigo),var(--violet)); color:#fff; font-weight:600; font-size:.88rem; cursor:pointer;
  box-shadow:0 10px 22px -12px var(--indigo); transition:transform .15s, box-shadow .2s, filter .2s}
.btn:hover{transform:translateY(-1px); box-shadow:0 16px 28px -14px var(--indigo); filter:saturate(1.08)}
.btn:active{transform:translateY(0)}
.btn svg{width:16px; height:16px}
.btn.ghost{background:var(--surface); color:var(--ink-2); border-color:var(--line); box-shadow:none}
.btn.ghost:hover{border-color:var(--line-2); color:var(--ink); box-shadow:var(--shadow)}
.btn.green{background:linear-gradient(97deg,var(--emerald),#0EA5A0); box-shadow:0 10px 22px -12px var(--emerald)}
.btn.sm{padding:6px 11px; font-size:.8rem; border-radius:9px}
.tag{display:inline-flex; align-items:center; gap:6px; font-size:.74rem; font-weight:600; padding:3px 9px; border-radius:20px; background:var(--chip); color:var(--ink-2)}
.tag.ok{background:var(--ok-bg); color:var(--ok-ink)} .tag.warn{background:var(--warn-bg); color:var(--warn-ink)}
.tag.bad{background:var(--bad-bg); color:var(--bad-ink)} .tag.info{background:var(--info-bg); color:var(--info-ink)}
.dotc{width:7px; height:7px; border-radius:50%; flex:none}

/* ---------- KPI ---------- */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(218px,1fr)); gap:14px; margin-bottom:18px}
.kpi{position:relative; overflow:hidden; padding:16px 17px; border-radius:16px; background:var(--surface); border:1px solid var(--line);
  box-shadow:var(--shadow); transition:transform .22s cubic-bezier(.22,1,.36,1), box-shadow .22s, border-color .22s; cursor:default}
.kpi:hover{transform:translateY(-4px); box-shadow:var(--shadow-lift); border-color:transparent}
.kpi::after{content:""; position:absolute; left:0; right:0; top:0; height:3px; background:linear-gradient(90deg,var(--indigo),var(--violet),var(--emerald));
  transform:scaleX(0); transform-origin:left; transition:transform .45s cubic-bezier(.22,1,.36,1)}
.kpi:hover::after{transform:scaleX(1)}
.kpi .lab{font-size:.8rem; color:var(--ink-3); display:flex; align-items:center; gap:7px}
.kpi .val{font-family:"Bricolage Grotesque",sans-serif; font-size:1.85rem; font-weight:600; letter-spacing:-.035em; margin:6px 0 2px; font-variant-numeric:tabular-nums}
.kpi .val small{font-size:.9rem; font-weight:500; color:var(--ink-3); letter-spacing:0}
.kpi .delta{font-size:.78rem; font-weight:600; display:flex; align-items:center; gap:5px}
.kpi .delta.up{color:var(--ok-ink)} .kpi .delta.down{color:var(--bad-ink)}
.kpi .spark{position:absolute; right:14px; bottom:12px; width:82px; height:34px; opacity:.85}
.kpi:hover .spark path.l{stroke-dasharray:200; stroke-dashoffset:200; animation:draw .8s cubic-bezier(.22,1,.36,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---------- Grilles ---------- */
.grid2{display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); gap:16px}
.chartcard{padding:18px 18px 8px}
.legend{display:flex; flex-wrap:wrap; gap:6px}
.legend button{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:var(--surface-2);
  padding:5px 10px; border-radius:20px; font-size:.78rem; font-weight:600; color:var(--ink-2); cursor:pointer; transition:opacity .2s, border-color .2s}
.legend button[aria-pressed="false"]{opacity:.42}
.legend button:hover{border-color:var(--line-2)}

/* ---------- Commandes : grille fluide, aucun défilement horizontal ---------- */
.statusblock{margin-bottom:26px}
.statusbar{display:flex; align-items:center; gap:11px; margin-bottom:12px; padding-bottom:9px; border-bottom:1px solid var(--line)}
.statusbar h3{font-size:1rem}
.statusbar .n{font-size:.76rem; font-variant-numeric:tabular-nums; color:var(--ink-3); background:var(--chip); padding:2px 8px; border-radius:20px}
.statusbar .sum{margin-left:auto; font-size:.82rem; color:var(--ink-3); font-variant-numeric:tabular-nums}
.ordergrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(272px,1fr)); gap:13px}
.order{position:relative; overflow:hidden; padding:14px 15px 13px; border-radius:15px; background:var(--surface);
  border:1px solid var(--line); box-shadow:var(--shadow); transition:transform .2s, box-shadow .2s}
.order:hover{transform:translateY(-3px); box-shadow:var(--shadow-lift)}
.order::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent,var(--indigo))}
.order .ref{font-size:.72rem; color:var(--ink-3); font-variant-numeric:tabular-nums}
.order .who{font-weight:600; font-size:.95rem; margin-top:1px}
.order .item{font-size:.84rem; color:var(--ink-2); margin-top:7px}
.order .meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px; font-size:.76rem; color:var(--ink-3)}
.order .foot{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; padding-top:11px; border-top:1px dashed var(--line-2)}
.status-select{max-width:170px; padding:6px 8px; border:1px solid var(--line); border-radius:9px; background:var(--surface-2); font-size:.74rem; font-weight:600}
.order .amount{font-family:"Bricolage Grotesque",sans-serif; font-weight:600; font-size:1.02rem; font-variant-numeric:tabular-nums}
.order.fresh{animation:landing 1.1s cubic-bezier(.22,1,.36,1)}
@keyframes landing{0%{opacity:0; transform:translateY(-14px) scale(.96); box-shadow:0 0 0 3px var(--emerald)}
  60%{box-shadow:0 0 0 3px color-mix(in srgb,var(--emerald) 60%, transparent)} 100%{opacity:1; transform:none}}
.empty{padding:22px; border:1px dashed var(--line-2); border-radius:14px; color:var(--ink-3); font-size:.86rem; background:var(--surface-2)}

/* ---------- Catalogue ---------- */
.prodgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px}
.prod{padding:16px; border-radius:15px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:9px; transition:transform .2s, box-shadow .2s}
.prod-actions{display:grid;grid-template-columns:1fr auto auto auto;gap:7px;margin-top:4px}
.prod-actions .btn:first-child{min-width:0}
.prod:hover{transform:translateY(-3px); box-shadow:var(--shadow-lift)}
.prod .sku{font-size:.72rem; color:var(--ink-3); font-variant-numeric:tabular-nums}
.prod .name{font-family:"Bricolage Grotesque",sans-serif; font-weight:600; font-size:1.06rem; letter-spacing:-.02em}
.prod .price{font-size:1.15rem; font-weight:700; font-variant-numeric:tabular-nums; color:var(--emerald)}
.prod .price span{font-size:.78rem; font-weight:600; color:var(--ink-3)}
.prod .idbadge{width:26px; height:26px; border-radius:8px; display:grid; place-items:center; font-size:.8rem; font-weight:700;
  background:linear-gradient(140deg,var(--indigo),var(--violet)); color:#fff; font-variant-numeric:tabular-nums}

/* ---------- Conversations ---------- */
.convwrap{display:grid; grid-template-columns:300px minmax(0,1fr); gap:16px; align-items:start}
.convlist{padding:8px; max-height:74vh; overflow-y:auto}
.convitem{display:flex; gap:11px; padding:11px; border-radius:12px; border:0; background:transparent; width:100%; cursor:pointer; text-align:left}
.convitem-wrap{display:flex;align-items:center;gap:3px;border-radius:12px}
.convitem-wrap{position:relative;display:block}
.convitem-wrap:hover{background:var(--surface-3)}
.convitem-wrap .convitem{flex:1}
.convitem-wrap>.iconbtn{position:absolute;right:8px;bottom:5px;opacity:0;z-index:2;width:24px;height:24px}
.convitem-wrap:hover>.iconbtn,.convitem-wrap:focus-within>.iconbtn{opacity:1}
.convitem-wrap:hover .convitem p{padding-right:28px}
.iconbtn.danger{color:var(--bad-ink);font-size:1.2rem}

<body>
<div class="mesh" aria-hidden="true"><span class="m1"></span><span class="m2"></span><span class="m3"></span></div>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main id="view"></main>
  </div>
</div>
<div id="auth-root" class="auth-root" hidden></div>
<div id="toasts" aria-live="polite"></div>
<script>

/* ==========================================================================
  OmniVente — tableau de bord connecté au backend FastAPI local

   Deux modes, choisis automatiquement au chargement :

   • MODE CONNECTÉ (LIVE = true)     Toutes les données viennent de l'API :
     commandes, clients, catalogue, conversations réelles WhatsApp / Instagram /
     Messenger / e-mail. Le panneau « Tester l'agent » de l'onglet Conversations
     envoie de vrais messages à /api/chat — même moteur, même base de données,
     même Groq que sur WhatsApp.

   • MODE DÉMONSTRATION (LIVE = false) Utilisé si config.js n'a pas encore été
    renseigné, ou si le backend est injoignable. Un moteur conversationnel local, strictement identique à la
     machine d'état du backend, permet de continuer la présentation sans
     interruption. Un bandeau en haut de l'écran l'indique toujours clairement.
   ========================================================================== */

const API_BASE = (window.OMNIVENTE_API_BASE || '').replace(/\/+$/, '');
let TENANT_SLUG = window.OMNIVENTE_TENANT || 'kino-steak';
const POLL_MS = 7000;
const AUTH_STORAGE_KEY = 'omnivente-auth';
let authSession = null;
let pollTimer = null;

let LIVE = false;              // passe à true si le backend répond au chargement
let apiError = null;           // dernier message d'erreur réseau, pour le bandeau
let health = null;             // dernière réponse de GET /health (statut Groq, sondeur e-mail…)

async function api(path, opts = {}) {
  const res = await fetch(API_BASE + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'X-Tenant': TENANT_SLUG, ...(opts.headers || {}) },
  });
  if (!res.ok) {
    const detail = await res.text().catch(() => '');
    throw new Error(`${opts.method || 'GET'} ${path} → ${res.status} ${detail.slice(0, 140)}`);
  }
  return res.status === 204 ? null : res.json();
}

  async function authApi(path, payload) {
    const res = await fetch(API_BASE + path, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const detail = await res.text().catch(() => '');
      let message = 'Impossible de traiter la demande.';
      try { message = JSON.parse(detail).detail || message; } catch (e) {}
      throw new Error(message);
    }
    return res.json();
  }

  function readAuthSession() {
    try {
      const raw = localStorage.getItem(AUTH_STORAGE_KEY);
      authSession = raw ? JSON.parse(raw) : null;
    } catch (e) { authSession = null; }
    if (authSession?.tenant) TENANT_SLUG = authSession.tenant;
    return authSession;
  }

  function saveAuthSession(session) {
    authSession = session;
    TENANT_SLUG = session.tenant;
    localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(session));
  }

  function clearAuthSession() {
    authSession = null;
    try { localStorage.removeItem(AUTH_STORAGE_KEY); } catch (e) {}
    LIVE = false;
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  function renderAuth(mode = 'login', message = '') {
    const root = $('#auth-root');
    if (!root) return;
    document.querySelector('.app').hidden = true;
    root.hidden = false;
    const register = mode === 'register';
    root.innerHTML = `<section class="auth-shell" aria-labelledby="auth-title">
      <div class="auth-brand">
        <div class="brand">${LOGO}<div><b>OmniVente</b><small>Commerce conversationnel</small></div></div>
        <div><div><h1>Votre commerce, au même endroit.</h1><p>Centralisez vos conversations, vos commandes et votre catalogue dans une interface claire et responsive.</p></div>
        <p class="auth-note">Accès sécurisé pour les équipes commerciales.</p></div>
      </div>
      <form class="auth-form" id="auth-form">
        <h2 id="auth-title">${register ? 'Créer votre compte' : 'Bon retour'}</h2>
        <p>${register ? 'Configurez votre espace marchand en quelques secondes.' : 'Connectez-vous pour accéder à votre tableau de bord.'}</p>
        <div class="auth-fields">
          ${register ? '<label>Nom de l’entreprise<input name="company" required maxlength="160" autocomplete="organization"></label><label>Nom du responsable<input name="manager" required maxlength="120" autocomplete="name"></label>' : ''}
          <label>Adresse e-mail<input name="email" type="email" required autocomplete="email"></label>
          <label>Mot de passe<input name="password" type="password" required minlength="8" autocomplete="${register ? 'new-password' : 'current-password'}"></label>
        </div>
        <div class="auth-error" role="alert">${esc(message)}</div>
        <div class="auth-actions"><button class="btn primary" type="submit">${register ? 'Créer le compte' : 'Se connecter'}</button></div>
        <div class="auth-switch">${register ? 'Vous avez déjà un compte ?' : 'Vous n’avez pas encore de compte ?'} <button type="button" data-auth-mode="${register ? 'login' : 'register'}">${register ? 'Se connecter' : 'Créer un compte'}</button></div>
      </form>
    </section>`;
    $('#auth-form').addEventListener('submit', handleAuthSubmit);
  }

  async function handleAuthSubmit(event) {
    event.preventDefault();
    const form = event.currentTarget;
    const data = Object.fromEntries(new FormData(form).entries());
    const register = Boolean(form.elements.company);
    const button = form.querySelector('button[type="submit"]');
    button.disabled = true;
    try {
      const session = await authApi(register ? '/auth/register' : '/auth/login', data);
      saveAuthSession(session);
      document.querySelector('.app').hidden = false;
      $('#auth-root').hidden = true;
      await startDashboard();
    } catch (error) {
      renderAuth(register ? 'register' : 'login', error.message);
    }
  }

  function logout() {
    clearAuthSession();
    state.view = 'dashboard';
    state.conv = 'live';
    renderAuth('login', 'Vous êtes déconnecté.');
  }
async function checkApi() {
  if (!API_BASE || API_BASE.includes('VOTRE-BACKEND') || API_BASE.includes('TON-BACKEND')) {
    apiError = 'config.js n\u2019a pas encore été renseigné avec l\u2019adresse du backend.';
    return false;
  }
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 4000);
    const res = await fetch(API_BASE.replace(/\/api\/?$/, '') + '/health', { signal: ctrl.signal });
    clearTimeout(timer);
    if (!res.ok) { apiError = `Le backend a répondu ${res.status}.`; return false; }
    health = await res.json().catch(() => null);
    return true;
  } catch (e) {
    apiError = 'Backend local injoignable. Vérifiez que le serveur FastAPI est lancé.';
    return false;
  }
}

function timeAgo(iso) {
  if (!iso) return '—';
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 5) return 'à l\u2019instant';
  if (diff < 60) return `il y a ${Math.round(diff)} s`;
  if (diff < 3600) return `il y a ${Math.round(diff / 60)} min`;
  if (diff < 86400) return `il y a ${Math.round(diff / 3600)} h`;
  if (diff < 172800) return 'hier';
  return `il y a ${Math.round(diff / 86400)} j`;
}
/* ---------------------------- Utilitaires ---------------------------- */
const $ = s => document.querySelector(s);
const el = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const fcfa = n => new Intl.NumberFormat('fr-FR').format(n) + ' FCFA';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials = n => n.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const sleep = ms => new Promise(r => setTimeout(r, ms));

const ICON = {
  dash:'M3 12h6V3H3v9Zm0 9h6v-6H3v6Zm12 0h6V12h-6v9Zm0-18v6h6V3h-6Z',
  chat:'M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12Z',
  bag:'M6 7h12l1 13H5L6 7Zm3 0a3 3 0 0 1 6 0',
  box:'M21 8.5 12 3 3 8.5v7L12 21l9-5.5v-7ZM3 8.5 12 14l9-5.5',

function mapOrder(o) {
  return {
    ref: o.reference, client: o.client.name, phone: o.client.phone || o.client.email || '',
    channel: o.channel, product: o.product.name, qty: o.quantity, amount: Number(o.amount),
    status: o.status, mode: o.fulfilment, slot: o.slot || '—', place: o.place || '—',
    when: timeAgo(o.created_at), _ts: new Date(o.created_at).getTime(), _clientId: o.client.id,
  };
}

async function updateOrderStatus(reference, status) {
  if (!LIVE) return;
  try {
    await api(`/orders/${encodeURIComponent(reference)}`, {
      method: 'PATCH',
      body: JSON.stringify({ status }),
    });
    await refreshLiveQuiet();
    toast(`Commande ${reference} déplacée : ${STATUS[status].label}`);
  } catch (e) {
    toast('Impossible de modifier le statut de la commande');
    render();
  }
}

function productFormValues() {
  const value = id => document.querySelector(`#f_product_${id}`)?.value?.trim() || '';
  return { ref: value('ref'), position: Number(value('position')), name: value('name'),
    price: Number(value('price')), quantity: Number(value('quantity')), category: value('category') };
}
async function saveProduct() {
  if (!LIVE) return toast('Le catalogue est modifiable après connexion à l’API.');
  const payload = productFormValues();
  const original = $('#product_original_ref')?.value;
  try {
    await api(`/products${original ? `/${encodeURIComponent(original)}` : ''}`, {
      method: original ? 'PUT' : 'POST', body: JSON.stringify(payload),
    });
    await refreshLiveQuiet(); render(); toast('Produit enregistré');
  } catch (e) { toast('Impossible d’enregistrer ce produit'); }
}
async function adjustStock(ref, delta) {
  const product = PRODUCTS.find(p => p.ref === ref);
  if (!LIVE || !product) return;
  try { await api(`/products/${encodeURIComponent(ref)}/stock`, { method:'PATCH', body:JSON.stringify({quantity:Math.max(0, product.qty + delta)}) });
    await refreshLiveQuiet(); render();
  } catch (e) { toast('Impossible de modifier le stock'); }
}
async function deleteProduct(ref) {
  if (!LIVE || !confirm(`Supprimer ${ref} ?`)) return;
  try { await api(`/products/${encodeURIComponent(ref)}`, {method:'DELETE'}); await refreshLiveQuiet(); render(); toast('Produit supprimé'); }
  catch (e) { toast('Ce produit est peut-être déjà utilisé dans une commande'); }
}
async function deleteClient(id, name) {
  if (!LIVE) return toast('La suppression nécessite le backend connecté.');

function computeClientStats() {
  const byId = {};
  state.orders.forEach(o => {
    byId[o._clientId] = byId[o._clientId] || { orders: 0, spent: 0 };
    if (o.status !== 'probleme') { byId[o._clientId].orders++; byId[o._clientId].spent += o.amount; }
  });
  return byId;
}

async function loadFromApi() {
  const [stats, board, products, clientsRaw, profile, integrations] = await Promise.all([
    api('/stats'), api('/orders/board'), api('/products'), api('/clients'), api('/tenant'), api('/tenant/integrations'),
  ]);

  PRODUCTS = products.map(p => ({ n: p.position, ref: p.ref, name: p.name, price: Number(p.price),
    inStock: p.in_stock, qty: p.quantity, cat: p.category || 'Catalogue' }));

  state.orders = Object.values(board).flat().map(mapOrder).sort((a, b) => b._ts - a._ts);

  const cstats = computeClientStats();
  state.clients = clientsRaw.map(c => ({
    id: c.id, name: c.name, phone: c.phone || c.email || '—', channel: c.channel,
    orders: (cstats[c.id] || {}).orders || 0, spent: (cstats[c.id] || {}).spent || 0,
    last: timeAgo(c.last_seen_at),
  }));

  state.profile = profile;
  state.integrations = integrations;
  state.activity = {
    days: stats.days,
    whatsapp: stats.messages_by_channel.whatsapp, instagram: stats.messages_by_channel.instagram,
    messenger: stats.messages_by_channel.messenger, email: stats.messages_by_channel.email,
  };

  await refreshConversationList();
  await refreshTestConversationList();
}

async function refreshLiveQuiet() {
  if (!LIVE) return;
  try {
    const [stats, board, products, clientsRaw] = await Promise.all([
      api('/stats'), api('/orders/board'), api('/products'), api('/clients'),
    ]);
    PRODUCTS = products.map(p => ({ n: p.position, ref: p.ref, name: p.name, price: Number(p.price),
      inStock: p.in_stock, qty: p.quantity, cat: p.category || 'Catalogue' }));
    state.orders = Object.values(board).flat().map(mapOrder).sort((a, b) => b._ts - a._ts);
    const cstats = computeClientStats();
    state.clients = clientsRaw.map(c => ({
      id: c.id, name: c.name, phone: c.phone || c.email || '—', channel: c.channel,
      orders: (cstats[c.id] || {}).orders || 0, spent: (cstats[c.id] || {}).spent || 0,
      last: timeAgo(c.last_seen_at),
    }));
    state.activity = { days: stats.days, whatsapp: stats.messages_by_channel.whatsapp,
      instagram: stats.messages_by_channel.instagram, messenger: stats.messages_by_channel.messenger,
      email: stats.messages_by_channel.email };
    await refreshConversationList();
    await refreshTestConversationList();
    const activeInput = document.activeElement;
    const isTyping = (activeInput?.id === 'sellerinput' || activeInput?.id === 'testinput')
      && activeInput.value.length > 0;
    if (!isTyping && (state.view === 'dashboard' || state.view === 'orders' || state.view === 'catalogue'

/* ------------------------------ Graphiques ------------------------------ */
function sparkline(vals, color){
  const w=82,h=34,max=Math.max(...vals),min=Math.min(...vals),span=(max-min)||1;
  const pts = vals.map((v,i)=>[i*(w/(vals.length-1)), h-3-((v-min)/span)*(h-8)]);
  const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" fill="none" aria-hidden="true">
    <path d="${d} L ${w} ${h} L 0 ${h} Z" fill="${color}" opacity=".12"/>
    <path class="l" d="${d}" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function channelChart(){
  const W=700,H=248,L=38,R=10,T=16,B=28;
  const a=state.activity, keys=Object.keys(CH).filter(k=>!state.hidden[k]);
  const max=Math.max(10,...keys.flatMap(k=>a[k]))*1.2;
  const x=i=>L+i*((W-L-R)/(a.days.length-1));
  const y=v=>T+(1-v/max)*(H-T-B);
  const grid=[0,.25,.5,.75,1].map(f=>{
    const gy=T+f*(H-T-B), val=Math.round(max*(1-f));
    return `<line x1="${L}" x2="${W-R}" y1="${gy}" y2="${gy}" stroke="var(--line)" stroke-width="1"/>
      <text x="${L-9}" y="${gy+4}" text-anchor="end" font-size="10" fill="var(--ink-3)">${val}</text>`}).join('');
  const series=keys.map(k=>{
    const d=a[k].map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
    return `<path d="${d} L ${x(a.days.length-1)} ${H-B} L ${L} ${H-B} Z" fill="${CH[k].color}" opacity=".10"/>
      <path d="${d}" stroke="${CH[k].color}" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      ${a[k].map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="var(--surface)" stroke="${CH[k].color}" stroke-width="2"><title>${CH[k].label} · ${a.days[i]} : ${v} messages</title></circle>`).join('')}`;
  }).join('');
  const labels=a.days.map((d,i)=>`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="var(--ink-3)">${d}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Messages reçus par canal sur 7 jours">${grid}${series}${labels}</svg>`;
}

function donut(){
  const totals=Object.keys(CH).map(k=>({k,v:state.orders.filter(o=>o.channel===k).reduce((s,o)=>s+o.amount,0)})).filter(t=>t.v>0);
  const sum=totals.reduce((s,t)=>s+t.v,0)||1;
  const R=52,C=2*Math.PI*R; let off=0;
  const arcs=totals.map(t=>{
    const len=(t.v/sum)*C;
    const s=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${CH[t.k].color}" stroke-width="17"
      stroke-dasharray="${(len-3).toFixed(1)} ${(C-len+3).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}"
      transform="rotate(-90 70 70)" stroke-linecap="round"><title>${CH[t.k].label} : ${fcfa(t.v)}</title></circle>`;
    off+=len; return s;
  }).join('');
  return `<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
    <svg viewBox="0 0 140 140" style="width:140px;height:140px;flex:none">${arcs}
      <text x="70" y="66" text-anchor="middle" font-size="12" fill="var(--ink-3)">Ventes</text>
      <text x="70" y="86" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink)">${new Intl.NumberFormat('fr-FR',{notation:'compact'}).format(sum)}</text></svg>
    <div style="display:flex;flex-direction:column;gap:9px;flex:1;min-width:150px">
      ${totals.sort((a,b)=>b.v-a.v).map(t=>`<div style="display:flex;align-items:center;gap:9px;font-size:.84rem">
        <span class="dotc" style="background:${CH[t.k].color}"></span><span>${CH[t.k].label}</span>
        <b class="num" style="margin-left:auto">${Math.round(t.v/sum*100)} %</b></div>`).join('')}
    </div></div>`;
}

/* ==========================================================================
   /* ==========================================================================
   CONVERSATIONS

   Mode connecté : la colonne de gauche liste les vrais fils WhatsApp /
   Instagram / Messenger / e-mail, alimentés par les webhooks du backend.
   Un premier item épinglé, « Tester l'agent », envoie de vrais messages à
   /api/chat — même base de données, même Groq, même machine d'état que sur
   WhatsApp, sans avoir besoin d'un téléphone pendant la présentation.

   Mode démonstration : un moteur conversationnel local, qui reproduit à
   l'identique app/services/state_machine.py, permet de rejouer le parcours
   de vente sans backend.
   ========================================================================== */

const TEST_EXTERNAL_ID = 'demo-tableau-de-bord';

/* ---------------------- Mode connecté : vrai backend ---------------------- */
async function openLiveConversation(clientId) {
  state.conv = clientId;
  try {
    const messages = await api(`/conversations/${clientId}/messages`);
    const stream = $('#stream');
    if (!stream) return;
    stream.innerHTML = messages.map(m => {
      const kind = m.direction === 'in' ? 'me' : (/enregistré|confirmée/i.test(m.body) ? 'sys' : 'bot');
      return `<div class="bub ${kind}">${esc(m.body)}</div>`;
    }).join('') || `<div class="empty">Aucun message pour l\u2019instant.</div>`;
    stream.scrollTop = stream.scrollHeight;
  } catch (e) { toast('Impossible de charger cette conversation.'); }
}

async function sendTestMessage(text) {
  if (!text.trim()) return;
  state.testName = $('#test-name')?.value.trim() || state.testName;
  if (!state.testName) {
    toast('Indiquez le nom du client avant de discuter.');
    $('#test-name')?.focus();
    return;
  }
  if (!state.testSession) state.testSession = `test:${Date.now()}`;
  bubbleTest('me', text);
  const composer = $('#testinput'); if (composer) composer.value = '';
  const typing = el('<div class="typing"><i></i><i></i><i></i></div>');
  $('#teststream')?.appendChild(typing);
  $('#teststream').scrollTop = $('#teststream').scrollHeight;
  try {
    const reply = await api('/chat', { method: 'POST', body: JSON.stringify({
      channel: state.testChannel, external_id: state.testSession,
      name: state.testName, text }) });
    typing.remove();
    bubbleTest('bot', reply.reply);
    if (reply.step === 'position') showTestLocationControls();
    else if (state.locationStep) {
      $('#testlocation').innerHTML = '';
      state.locationStep = false;
    }
    if (reply.order_reference) {
      toast(`Commande ${reply.order_reference} créée — visible dans « Commandes »`);
      await refreshLiveQuiet();
    }
    await refreshTestConversationList();
    return reply;
  } catch (e) {
    typing.remove();
    bubbleTest('bot', 'Connexion au backend perdue. Vérifiez que le serveur local est bien démarré.');
    return null;
  }
}
function showTestLocationControls() {
  const target = $('#testlocation');
  if (!target) return;
  state.locationStep = true;
  target.innerHTML = `<div class="location-modal" role="dialog" aria-modal="true" aria-labelledby="location-title">
  <div class="location-panel">
    <button class="location-close" data-act="closelocation" aria-label="Fermer la localisation">×</button>
    <div class="location-title" id="location-title">${svg(ICON.pin,2)} Localisation de livraison</div>
    <div class="location-help">Choisissez « Position actuelle » ou cliquez sur la carte, vérifiez l’adresse puis appuyez sur Envoyer.</div>
    <input id="test-location-manual" placeholder="Latitude, longitude ou adresse" aria-label="Position manuelle">
    <button class="btn" data-act="sharetestlocation">${svg(ICON.pin,1.8)}Position actuelle</button>
    <div id="test-map" aria-label="Carte de localisation"></div>
    <div class="location-status" id="location-status" aria-live="polite">Aucune position sélectionnée.</div>
    <button class="btn" data-act="sendtestlocation">${svg(ICON.send,1.8)}Envoyer la localisation</button>
  </div></div>`;
  if (window.L) {
    const map = L.map('test-map').setView([6.13, 1.22], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);
    map.on('click', event => {
      const value = `${event.latlng.lat.toFixed(6)}, ${event.latlng.lng.toFixed(6)}`;
      $('#test-location-manual').value = value;
      $('#location-status').textContent = `Position sélectionnée : ${value}`;
      L.marker(event.latlng).addTo(map);
    });
    setTimeout(() => map.invalidateSize(), 100);
  } else {
    const mapTarget = $('#test-map');
    if (mapTarget) {
      mapTarget.innerHTML = '<div class="location-map-fallback">La carte est indisponible pour le moment. Saisissez une adresse ou des coordonnées ci-dessus.</div>';
    }
  }
  function closeLocationModal() {
    $('#testlocation').innerHTML = '';
    state.locationStep = false;
  }
}
async function shareTestLocation() {
  const status = $('#location-status');
  if (!navigator.geolocation) {
    if (status) status.textContent = 'La géolocalisation n’est pas disponible dans ce navigateur.';
    return toast('La géolocalisation n’est pas disponible dans ce navigateur.');
  }
  if (status) status.textContent = 'Recherche de votre position… Autorisez la localisation du navigateur.';
  navigator.geolocation.getCurrentPosition(
    position => {
      const value = `${position.coords.latitude.toFixed(6)}, ${position.coords.longitude.toFixed(6)}`;
      const input = $('#test-location-manual');
      if (input) input.value = value;
      if (status) status.textContent = `Position trouvée : ${value}. Appuyez sur Envoyer la localisation.`;
    },
    error => {
      const reason = error.code === 1 ? 'Autorisation refusée.' : 'Position indisponible.';
      if (status) status.textContent = `${reason} Cliquez sur la carte ou saisissez une adresse.`;
      toast(`${reason} Vérifiez les permissions du navigateur.`);
    },
    {enableHighAccuracy: true, timeout: 10000, maximumAge: 30000});
}

  if (!LIVE) return toast('La suppression nécessite le backend connecté.');

    .find(item => item.client_id === clientId);
  if (!conversation || !confirm(`Supprimer la conversation de ${conversation.name} et son historique ?`)) return;
  try {

  await botSays(catalogueText());

async function handleInput(raw){
  const text=raw.trim(); if(!text) return;
  bubble('me', text);
  const n=parseInt(text.replace(/\D+/g,''),10);
  const input=$('#chatinput'); if(input) input.value='';

  switch(bot.step){
    case 'catalogue':{
      if(!Number.isInteger(n)||n<1||n>PRODUCTS.length){
        await botSays('Je n\u2019ai pas reconnu ce numéro. Tapez un chiffre entre 1 et 8 pour choisir un article.'); break;
      }
      const p=PRODUCTS[n-1];
      if(!p.inStock){
        await botSays(`Le ${p.name} est en rupture de stock pour le moment.\nVoici ce qui est disponible immédiatement :\n${alternatives()}\n\nRépondez par un numéro.`);
        break;
      }
      bot.product=p;
      await botSays(`${p.name} — ${fcfa(p.price)} l\u2019unité.\nCombien d\u2019exemplaires souhaitez-vous ? (Tapez un chiffre : 1, 2, 3…)`);
      bot.step='quantite'; break;
    }
    case 'quantite':{
      if(!Number.isInteger(n)||n<1){ await botSays('Indiquez une quantité en chiffres, par exemple 2.'); break; }
      if(n>bot.product.qty){
        await botSays(`Il ne reste que ${bot.product.qty} unités de ${bot.product.name}. Indiquez une quantité inférieure ou égale à ${bot.product.qty}.`); break;
      }
      bot.qty=Math.min(n,99);
      await botSays(`${bot.qty} × ${bot.product.name} = ${fcfa(bot.qty*bot.product.price)}.\n\nComment souhaitez-vous récupérer votre commande ?\n1 - Livraison à domicile\n2 - Retrait en boutique`);
      bot.step='mode'; break;
    }
    case 'mode':{
      if(n!==1&&n!==2){ await botSays('Tapez 1 pour la livraison à domicile, ou 2 pour le retrait en boutique.'); break; }
      bot.mode = n===1?'livraison':'retrait';
      await botSays(n===1
        ? 'Quel jour et à quelle heure souhaitez-vous être livré ? (ex. : jeudi 18 septembre à 14h00)'
        : 'Quel jour et à quelle heure passerez-vous à la boutique Tokoin ? (ex. : jeudi 18 septembre à 10h30)');
      bot.step='creneau'; break;
    }
    case 'creneau':{
      if(text.length<3){ await botSays('Précisez le jour et l\u2019heure, par exemple « jeudi 18 septembre à 10h30 ».'); break; }
      bot.slot=text;
      if(bot.mode==='livraison'){
        await botSays('Merci. Envoyez maintenant votre position GPS (ou le nom de votre quartier) pour guider le livreur.');
        bot.step='position';
      } else {
        bot.place='Boutique Tokoin';
        await botSays(summary());
        bot.step='validation';
      }
      break;
    }
    case 'position':{
      bot.place = /position|gps/i.test(text) ? '6.1319, 1.2492 · Bè-Kpota, Lomé' : text;
      await botSays(summary());
      bot.step='validation'; break;
    }
    case 'validation':{
      if(n===1){ await confirmOrder(); }
      else if(n===2){ await botSays('Pas de souci, reprenons.\n\n'+catalogueText()); bot=newSession(); }
      else { await botSays('Tapez 1 pour confirmer la commande, ou 2 pour la modifier.'); }
      break;
    }
    case 'fin':{
      await botSays(catalogueText()); bot=newSession(); break;
    }
  }
  setQuick();
}

      <span class="tag ${LIVE?'ok':'info'}" style="margin-left:auto">${svg(ICON.check,2.6)}${LIVE?'Enregistré en base':'Aperçu de démonstration'}</span></div>
    <div class="formgrid">
      ${field('company','Raison sociale',p.company)}
      ${field('sector','Secteur d\u2019activité',p.sector)}
      ${field('legal_form','Forme juridique',p.legal_form)}
      ${field('tax_id','Numéro d\u2019identification fiscale',p.tax_id)}
      ${field('manager','Responsable du compte',p.manager)}
      ${field('phone','Téléphone de la boutique',p.phone,'','tel')}
      ${field('email','E-mail de vente',p.email,'Utilisé pour les commandes reçues par e-mail','email')}
      ${field('website','Site web',p.website)}
    </div>
  </section>

  <section class="card pad" style="margin-top:16px">
    <div class="sechead"><div><h2>Adresse et logistique</h2><p>Ce que l\u2019agent communique au client au moment du retrait ou de la livraison</p></div></div>
    <div class="formgrid">
      ${field('address','Adresse',p.address)}
      ${field('city','Ville',p.city)}
      ${field('country','Pays',p.country)}
      ${field('currency','Devise affichée',p.currency)}
      ${field('opening_hours','Horaires d\u2019ouverture',p.opening_hours)}
      ${field('pickup_point','Point de retrait',p.pickup_point)}
      ${field('delivery_zone','Zone de livraison',p.delivery_zone)}
      <div class="field wide"><label for="f_about">Présentation de l\u2019entreprise</label>
        <textarea id="f_about" data-p="about">${esc(p.about||'')}</textarea>
        <span class="hint">L\u2019agent s\u2019appuie sur ce texte pour répondre aux questions générales des clients.</span></div>
    </div>
    <div class="formactions">
      <button class="btn" data-act="saveprofile">${svg(ICON.save,2)}Enregistrer les modifications</button>
      <button class="btn ghost" data-act="cancel">Annuler</button>
      <span style="margin-left:auto;font-size:.8rem;color:var(--ink-3)">${LIVE?'Les modifications sont écrites dans PostgreSQL.':'Mode démonstration : les modifications ne sont pas conservées.'}</span>
    </div>
  </section>`;
}

/* ------------------------- Canaux connectés ------------------------- */
function webhookUrl(kind){
  if (!LIVE) return `http://127.0.0.1:8000/webhooks/${kind}/${TENANT_SLUG}`;
  return API_BASE.replace(/\/api\/?$/, '') + `/webhooks/${kind}/${TENANT_SLUG}`;
}
function copyRow(label, value){
  return `<div class="field wide"><label>${label}</label>
    <div style="display:flex;gap:8px"><input readonly value="${esc(value)}" style="font-family:ui-monospace,monospace;font-size:.82rem">
    <button class="btn ghost sm" data-copy="${esc(value)}" style="flex:none">${svg(ICON.link,1.8)}Copier</button></div></div>`;
}
function viewSettings(){
  return `<div class="banner" style="background:var(--info-bg);color:var(--info-ink)">
    ${svg(ICON.help,2)}<span><b>Les identifiants sont protégés côté serveur et ne sont jamais réaffichés.</b>
    Laissez un champ vide pour conserver sa valeur actuelle.</span></div>

  <div class="intgrid">
    <section class="card pad">
      <div class="channelhead">
        <span class="ico" style="background:var(--wa)">${svgFill(ICON.wa)}</span>
        <div><b>WhatsApp Business</b><span>Canal principal · API Cloud Meta</span></div>
        <span class="tag ${LIVE&&state.integrations.whatsapp?.access_token?'ok':'warn'}">${!LIVE?'Backend non connecté':(state.integrations.whatsapp?.access_token?'Jeton configuré':'Configuration incomplète')}</span>
      </div>
      <div class="formgrid">
        ${field('channel_wa_phone','Phone Number ID',state.integrations.whatsapp?.phone_number_id||'')}
        ${field('channel_wa_token','Access Token', '', 'Jeton Meta WhatsApp', 'password')}
        ${copyRow('URL de rappel (Callback URL) à coller dans Meta', webhookUrl('whatsapp'))}
        ${field('channel_wa_verify','Jeton de vérification',state.integrations.whatsapp?.verify_token||'omnivente_kino_2026','','text')}
      </div>
      <div class="hint" style="margin-top:10px">Le Phone Number ID, le jeton d\u2019accès et le jeton de vérification se configurent ici, puis restent masqués.</div>
    </section>

    <section class="card pad">
      <div class="channelhead">
        <span class="ico" style="background:linear-gradient(140deg,#F09433,var(--ig),#6228D7)">${svg(ICON.ig,2)}</span>
        <div><b>Instagram et Messenger</b><span>Messages directs via l\u2019API Graph de Meta</span></div>
        <span class="tag ${LIVE&&state.integrations.meta?.page_access_token?'ok':'warn'}">${!LIVE?'Backend non connecté':(state.integrations.meta?.page_access_token?'Jeton configuré':'Configuration incomplète')}</span>
      </div>
      <div class="formgrid">
        ${field('channel_meta_token','Page Access Token', '', 'Jeton de la Page Facebook', 'password')}
        ${copyRow('URL de rappel (Callback URL) à coller dans Meta', webhookUrl('meta'))}
        ${field('channel_meta_verify','Jeton de vérification',state.integrations.meta?.verify_token||'omnivente_kino_2026','','text')}
      </div>
      <div class="hint" style="margin-top:10px">Autorisations à demander : pages_messaging, instagram_manage_messages. Les messages Instagram et Messenger utilisent le jeton de Page enregistré ici.</div>
    </section>

    <section class="card pad">
      <div class="channelhead">
        <span class="ico" style="background:var(--em)">${svg(ICON.mail,2)}</span>
        <div><b>E-mail de vente</b><span>Relevé automatique par sondage IMAP (pas de webhook Gmail gratuit)</span></div>
        <span class="tag ${LIVE&&state.integrations.email?.sales_email?'ok':'warn'}">${!LIVE?'Backend non connecté':(state.integrations.email?.sales_email?'Boîte configurée':'Configuration incomplète')}</span>
      </div>
      <div class="formgrid">
        ${field('channel_email_address','Adresse e-mail',state.integrations.email?.sales_email||'','Adresse utilisée pour répondre','email')}
        ${field('channel_email_password','Mot de passe d’application','', 'Mot de passe Gmail/SMTP', 'password')}
      </div>
      <div class="hint">Tinos TechLogistics relève sa boîte toutes les 20 à 30 secondes — un délai normal, propre
        au sondage IMAP plutôt qu\u2019à un webhook. Renseignez <code>SALES_EMAIL</code>, <code>SALES_EMAIL_APP_PASSWORD</code>,
        <code>SMTP_HOST</code>/<code>IMAP_HOST</code> dans la configuration du canal (mot de passe d\u2019application, jamais le mot de passe du compte).</div>
    </section>
    <div class="formactions"><button class="btn" data-act="savechannels">${svg(ICON.save,2)}Enregistrer les canaux</button></div>
  </div>`;
}
/* ------------------------------ Routage ------------------------------ */
const VIEWS = {dashboard:viewDashboard, conversations:viewConversations, test:viewTest, orders:viewOrders,
  catalogue:viewCatalogue, clients:viewClients, profile:viewProfile, settings:viewSettings};

function render(quiet){
  renderSidebar(); renderTopbar();
  $('#view').innerHTML = VIEWS[state.view]();
  if(!quiet) window.scrollTo({top:0});

  if(state.view==='conversations'){
    if(!LIVE && state.conv==='live'){
      const s=$('#stream');
      if(state.log.length){ s.innerHTML = state.log.map(([k,t])=>`<div class="bub ${k}">${esc(t)}</div>`).join(''); s.scrollTop=s.scrollHeight; setQuick(); }
      else if(!bot){ botGreeting(); }
      else setQuick();
      $('#chatinput')?.focus({preventScroll:true});
    }
    if(LIVE && typeof state.conv==='number'){
      openLiveConversation(state.conv);
    }
    if(LIVE && state.conv==='test'){
      $('#testinput')?.focus({preventScroll:true});
    }
  }
  if(state.view==='test') $('#testinput')?.focus({preventScroll:true});
  state.orders.forEach(o=>delete o.fresh);
}
function go(v){
  if(!VIEWS[v]) return;
  state.view=v; $('#sidebar').classList.remove('open'); $('.scrim')?.remove(); $('#popover')?.remove();
  render();
}

/* ------------------------------ Thème ------------------------------ */
function currentTheme(){
  const set=document.documentElement.getAttribute('data-theme');
  if(set) return set;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function toggleTheme(){
  const next = currentTheme()==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('omnivente-theme', next); }catch(e){}
  renderTopbar();
}

/* ------------------------------ Événements ------------------------------ */
document.addEventListener('click', async (e)=>{
  const authMode = e.target.closest('[data-auth-mode]');
  if(authMode){ renderAuth(authMode.dataset.authMode); return; }
  const go_ = e.target.closest('[data-go]'); if(go_){ go(go_.dataset.go); return; }

  // Conversations — mode démonstration
  const conv = e.target.closest('[data-conv]');
  if(conv){ state.conv=conv.dataset.conv; state.view='conversations'; render(); return; }

  // Conversations — mode connecté
  const testconv = e.target.closest('[data-testconv]');
  if(testconv){ state.view='test'; render(); return; }
  const testSession = e.target.closest('[data-testsession]');
  if(testSession){
    const session = state.testConversations.find(s => s.client_id === Number(testSession.dataset.testsession));
    if(session) await openTestSession(session);
    return;
  }
  const liveconv = e.target.closest('[data-liveconv]');
  if(liveconv){ state.conv=Number(liveconv.dataset.liveconv); state.view='conversations'; render(); return; }
  const testchan = e.target.closest('[data-testchan]');
  if(testchan){ state.testChannel=testchan.dataset.testchan; render(); return; }
  const editProduct = e.target.closest('[data-edit-product]');
  if(editProduct){
    const p = PRODUCTS.find(item => item.ref === editProduct.dataset.editProduct);
    if(p){ $('#product_original_ref').value=p.ref; ['ref','position','name','price','quantity','category'].forEach(k=>{ const input=$(`#f_product_${k}`); if(input) input.value=k==='position'?p.n:k==='price'?p.price:k==='quantity'?p.qty:k==='category'?p.cat:p[k]; }); window.scrollTo({top:0,behavior:'smooth'}); }
    return;
  }
  const stockProduct = e.target.closest('[data-stock-product]');
  if(stockProduct){ await adjustStock(stockProduct.dataset.stockProduct, Number(stockProduct.dataset.stockDelta)); return; }
  const deleteProductButton = e.target.closest('[data-delete-product]');
  if(deleteProductButton){ await deleteProduct(deleteProductButton.dataset.deleteProduct); return; }
  const deleteClientButton = e.target.closest('[data-delete-client]');
  if(deleteClientButton){
    const client = state.clients.find(item => item.id === Number(deleteClientButton.dataset.deleteClient));
    if(client) await deleteClient(client.id, client.name);
    return;
  }
  const deleteConversationButton = e.target.closest('[data-delete-conversation]');
  if(deleteConversationButton){
    await deleteConversation(Number(deleteConversationButton.dataset.deleteConversation));
    return;
  }
  const toggleAiButton = e.target.closest('[data-toggle-ai]');
  if(toggleAiButton){
    const conversation = state.liveConversations.find(item => item.client_id === Number(toggleAiButton.dataset.toggleAi));
    if(conversation) await toggleConversationAi(conversation.client_id, conversation.ai_enabled === false);
    return;
  }
  const testquick = e.target.closest('[data-testquick]');
  if(testquick){ await sendTestMessage(testquick.dataset.testquick); return; }

  const quick = e.target.closest('[data-quick]');
  if(quick){ await handleInput(quick.dataset.quick); return; }
  const tog = e.target.closest('[data-toggle]');
  if(tog){ const k=tog.dataset.toggle; state.hidden[k]=!state.hidden[k];
    if(Object.keys(CH).every(c=>state.hidden[c])) state.hidden[k]=false; render(); return; }
  if(e.target.closest('#userbtn')){ togglePopover(); return; }

  const copy = e.target.closest('[data-copy]');
  if(copy){
    try{ await navigator.clipboard.writeText(copy.dataset.copy); toast('Copié dans le presse-papiers'); }
    catch(err){ toast('Copie impossible — sélectionnez le texte manuellement'); }
    return;
  }

  const act = e.target.closest('[data-act]')?.dataset.act; if(!act) return;
  switch(act){
    case 'send': await handleInput($('#chatinput').value); break;
    case 'sendtest': await sendTestMessage($('#testinput').value); break;
    case 'sharetestlocation': await shareTestLocation(); break;
    case 'sendtestlocation': await sendManualTestLocation(); break;
    case 'closelocation': closeLocationModal(); break;
    case 'newtest':
      state.testSession = null;
      state.testName = '';
      state.testChannel = 'whatsapp';
      state.view = 'test';
      render();
      break;
    case 'saveproduct': await saveProduct(); break;
    case 'clearproduct': render(); break;
    case 'savechannels': await saveChannels(); break;
    case 'sendreply': await sendSellerReply($('#sellerinput').value); break;
    case 'refreshconv': if(typeof state.conv==='number') await openLiveConversation(state.conv); break;
    case 'theme': toggleTheme(); break;
    case 'menu': {
      $('#sidebar').classList.add('open');
      const sc=el('<div class="scrim"></div>');
      sc.onclick=()=>{ $('#sidebar').classList.remove('open'); sc.remove(); };
      document.body.appendChild(sc); break;
    }
    case 'saveprofile': {
      const payload={};
      document.querySelectorAll('[data-p]').forEach(i=>{ payload[i.dataset.p]=i.value; state.profile[i.dataset.p]=i.value; });
      if(LIVE){
        try{ await api('/tenant', {method:'PUT', body:JSON.stringify(payload)}); toast('Modifications enregistrées dans PostgreSQL'); }
        catch(err){ toast('Échec de l\u2019enregistrement — backend injoignable'); }
      } else {
        toast('Modifications enregistrées (mode démonstration, non persisté)');
      }
      renderSidebar(); break;
    }
    case 'cancel': render(); toast('Modifications annulées'); break;
    case 'notif': await toggleNotifications(); break;
    case 'help': toast('Documentation : voir LOCAL_SETUP.md dans le projet'); break;
    case 'logout': logout(); break;
    case 'soon': toast('Création de référence disponible dans le catalogue complet'); break;
  }
});
document.addEventListener('change', async (e)=>{
  const select = e.target.closest('[data-order-status]');
  if (select) await updateOrderStatus(select.dataset.orderStatus, select.value);
});
document.addEventListener('input', (e)=>{
  if (e.target.id === 'test-name' && !state.testSession) state.testName = e.target.value;
});
document.addEventListener('keydown', async (e)=>{
  if(e.key==='Escape' && state.locationStep){ closeLocationModal(); return; }
  if(e.key==='Enter' && e.target.id==='chatinput'){ e.preventDefault(); await handleInput(e.target.value); }
  if(e.key==='Enter' && e.target.id==='testinput'){ e.preventDefault(); await sendTestMessage(e.target.value); }
  if(e.key==='Enter' && e.target.id==='sellerinput'){ e.preventDefault(); await sendSellerReply(e.target.value); }
  if(e.key==='Escape'){ $('#popover')?.remove(); $('#userbtn')?.setAttribute('aria-expanded','false'); }
});

/* ---------------------- Fond réactif au mouvement ---------------------- */
let raf=null;
window.addEventListener('pointermove', (e)=>{
  if(raf || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  raf=requestAnimationFrame(()=>{
    const x=(e.clientX/innerWidth-.5)*46, y=(e.clientY/innerHeight-.5)*46;
    document.documentElement.style.setProperty('--mx', x.toFixed(1));
    document.documentElement.style.setProperty('--my', y.toFixed(1));
    raf=null;
  });
});

/* ------------------------------ Démarrage ------------------------------ */
try{ const t=localStorage.getItem('omnivente-theme'); if(t) document.documentElement.setAttribute('data-theme',t); }catch(e){}

async function startDashboard(){
  loadDemoData();               // toujours prêt, même si l'API échoue juste après
  LIVE = await checkApi();
  if(LIVE){
    try{ await loadFromApi(); state.conv='test'; }
    catch(err){ LIVE=false; apiError='Le backend a répondu, mais une requête a échoué : '+err.message; loadDemoData(); }
  }
  render();
  if(LIVE) {
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(refreshLiveQuiet, POLL_MS);
  }
}

async function boot(){
  readAuthSession();
  if (!authSession) {
    renderAuth('login');
    return;
  }
  await startDashboard();
}
boot();
</script>
</body>
</html>
